
<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | Vincent Kiplangat</title>
    {% compress css %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}" />
    {% endcompress %}
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <style>
        body {
            background-color: #1a1a2e;
            text-align: center;
            font-family: 'Arial', sans-serif;
            color: white;
        }
        .error-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .error-code {
            font-size: 200px;
            font-weight: bold;
            color: #ff6b6b;
            animation: shake 0.5s infinite alternate;
        }
        @keyframes shake {
            from { transform: rotate(-5deg); }
            to { transform: rotate(5deg); }
        }
        .error-message {
            font-size: 28px;
            margin-top: -20px;
        }
        .error-description {
            font-size: 20px;
            margin: 10px 0 30px;
        }
        .main-btn {
            background-color: #ff6b6b;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .main-btn:hover {
            background-color: #d94b4b;
        }
    </style>
</head>

<body>
    <div class="error-page">
        <h1 class="error-code">500</h1>
        <h2 class="error-message">Oops! Something Went Wrong</h2>
        <p class="error-description">I am experiencing some issues on my end. Please try again later.</p>
        <a href="{% url 'index-main' %}" class="main-btn">Go Back Home</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let errorCode = document.querySelector(".error-code");
            errorCode.addEventListener("mouseover", function() {
                errorCode.style.color = "#ffcc00";
            });
            errorCode.addEventListener("mouseleave", function() {
                errorCode.style.color = "#ff6b6b";
            });
        });
    </script>
</body>

</html>
